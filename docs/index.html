<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Radar SECOP</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#14171a; --muted:#6b7280;
    --line:#e5e7eb; --accent:#0b6bcb; --hot:#d13438; --warm:#e08600; --cool:#6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --card:#161b22; --ink:#e6edf3; --muted:#8b949e;
            --line:#30363d; --accent:#58a6ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  /* ---- Login ---- */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card-login { background:var(--card); border:1px solid var(--line); border-radius:10px;
                padding:32px; width:100%; max-width:380px; }
  .card-login h1 { font-size:19px; margin:0 0 4px; }
  .card-login p.sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px;
          text-transform:uppercase; letter-spacing:.4px; }
  input, select, button { font-family:inherit; font-size:14px; }
  input[type=email], input[type=password], input[type=search], input[type=number], select {
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--ink); margin-bottom:15px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:10px 16px; cursor:pointer; font-weight:600; }
  button:hover { filter:brightness(1.08); }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .err { color:var(--hot); font-size:13px; margin-top:10px; min-height:18px; }

  /* ---- App ---- */
  #app { display:none; padding:24px 20px 60px; }
  .wrap { max-width:1240px; margin:0 auto; }
  header.top { display:flex; justify-content:space-between; align-items:center;
               gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  h1.title { font-size:21px; margin:0; }
  .who { color:var(--muted); font-size:12px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
          gap:12px; margin-bottom:22px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:15px; }
  .kpi .v { font-size:24px; font-weight:700; }
  .kpi .l { color:var(--muted); font-size:11px; text-transform:uppercase;
            letter-spacing:.5px; margin-top:3px; }
  .panel { background:var(--card); border:1px solid var(--line);
           border-radius:8px; padding:18px; margin-bottom:20px; }
  .filtros { display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto;
             gap:12px; align-items:end; }
  .filtros .campo { min-width:0; }
  .filtros input, .filtros select { margin-bottom:0; }
  .chk { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted);
         margin-top:12px; }
  .chk input { width:auto; margin:0; }
  @media (max-width:820px) { .filtros { grid-template-columns:1fr 1fr; } }

  .tabla-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:820px; }
  th { text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase;
       letter-spacing:.5px; padding:0 10px 10px; border-bottom:1px solid var(--line); }
  td { padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .objeto { font-weight:600; line-height:1.4; }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  .reasons { color:var(--muted); font-size:11px; margin-top:5px; font-style:italic; }
  .score { display:inline-block; min-width:38px; text-align:center; color:#fff;
           font-weight:700; border-radius:4px; padding:3px 7px; font-size:12px; }
  .score.hot { background:var(--hot); } .score.warm { background:var(--warm); }
  .score.cool { background:var(--cool); }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .nowrap { white-space:nowrap; } .muted { color:var(--muted); }
  .estado { text-align:center; color:var(--muted); padding:32px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .paginacion { display:flex; gap:10px; justify-content:center; align-items:center;
                margin-top:16px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>

<div id="login">
  <form class="card-login" id="form-login">
    <h1>Radar SECOP</h1>
    <p class="sub">Monitoreo de contratación pública</p>
    <label for="email">Correo</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" style="width:100%">Entrar</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div id="app">
  <div class="wrap">
    <header class="top">
      <div>
        <h1 class="title">Radar SECOP</h1>
        <div class="who" id="quien"></div>
      </div>
      <button class="ghost" id="salir">Cerrar sesión</button>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="panel">
      <div class="filtros">
        <div class="campo">
          <label for="q">Buscar</label>
          <input type="search" id="q" placeholder="competencias laborales, Palmira, alcaldía…">
        </div>
        <div class="campo">
          <label for="perfil">Perfil</label>
          <select id="perfil"><option value="">Todos</option></select>
        </div>
        <div class="campo">
          <label for="score">Score mínimo</label>
          <select id="score">
            <option value="">Cualquiera</option>
            <option value="60">60 — alertables</option>
            <option value="80">80 — alta prioridad</option>
          </select>
        </div>
        <div class="campo">
          <label for="valor">Valor mínimo</label>
          <input type="number" id="valor" placeholder="Ej. 50000000" min="0" step="1000000">
        </div>
        <div class="campo">
          <button id="buscar" style="width:100%">Buscar</button>
        </div>
      </div>
      <div class="chk">
        <input type="checkbox" id="abiertos" checked>
        <label for="abiertos" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;">
          Sólo procesos abiertos
        </label>
        <input type="checkbox" id="retirados" style="margin-left:18px;">
        <label for="retirados" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;">
          Incluir retirados del portal
        </label>
      </div>
    </div>

    <div class="panel">
      <div class="tabla-wrap"><div id="resultados"><div class="estado">Buscando…</div></div></div>
      <div class="paginacion" id="paginacion"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
