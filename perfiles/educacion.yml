# Perfil: ITGEM — Instituto Técnico de Gestión Empresarial
#
# Formación por competencias laborales, programas técnicos laborales y cursos
# cortos. Categoría regulatoria: ETDH (Educación para el Trabajo y el
# Desarrollo Humano). Sedes en Cali, Puerto Tejada y Corinto.
#
# Todo el texto se compara SIN tildes y SIN mayúsculas, así que da igual
# escribir "capacitación", "Capacitacion" o "CAPACITACIÓN".

nombre: ITGEM — Formación laboral
activo: true

# Destinatarios de las alertas de ESTE perfil.
# Si se deja vacío, usa la variable de entorno ALERT_TO.
alertar_a: []

geografia:
  departamentos:
    - Valle del Cauca
    - Cauca            # sedes de Puerto Tejada y Corinto

datasets:
  - procesos

umbral_score: 40      # mínimo para archivar
umbral_alerta: 60     # mínimo para disparar correo (subir si llega ruido)
max_registros: 50000

# Sólo procesos publicados en los últimos N días. Sin esta ventana el barrido
# baja todo el histórico de SECOP II, choca contra max_registros y devuelve un
# corte arbitrario de procesos casi todos ya cerrados.
dias_atras: 45

keywords:
  # El lenguaje real del sector. Se evitan a propósito términos sueltos como
  # "educacion" o "curso": aparecen en media contratación pública del país
  # (alimentación escolar, transporte, nómina docente) y eran la causa de que
  # el primer barrido devolviera 1.464 coincidencias inservibles.
  criticas:
    - competencias laborales
    - formacion para el trabajo
    - educacion para el trabajo
    - desarrollo humano
    - tecnico laboral
    - formacion por competencias
    - formacion titulada
    - formacion complementaria
    - certificacion de competencias
    - capacitacion
    - diplomado
    - gestion empresarial
    - cualificacion
    - reconversion laboral
    - habilidades para el trabajo

  # Suman puntos, no bastan por sí solas.
  deseables:
    - competencias digitales
    - habilidades blandas
    - emprendimiento
    - bilinguismo
    - ingles
    - talento humano
    - empleabilidad
    - insercion laboral
    - productividad
    - seguridad y salud en el trabajo
    - primeros auxilios
    - servicio al cliente
    - liderazgo
    - manipulacion de alimentos
    - virtual
    - modalidad virtual
    - plataforma de aprendizaje
    - icontec
    - poblacion vulnerable
    - jovenes

  # Los grandes generadores de falsos positivos en contratación educativa
  # colombiana. El PAE y el transporte escolar mueven cifras enormes y su
  # texto está lleno de "educación" y "escolar", pero no son formación.
  excluyentes:
    - alimentacion escolar
    - programa de alimentacion
    - pae
    - transporte escolar
    - restaurante escolar
    - infraestructura educativa
    - construccion de aulas
    - mantenimiento de sedes educativas
    - dotacion escolar
    - mobiliario escolar
    - uniformes
    - utiles escolares
    - kit escolar
    - obra civil
    - construccion de vias
    - pavimentacion
    - combustible
    - mantenimiento de vehiculos
    - compra de vehiculos
    - papeleria
    - suministro de alimentos

# Familias UNSPSC. La 86 es "Servicios de educación y formación".
# Un código que empiece por estos dígitos suma, sin depender del texto.
#
# Para afinarlas: dejá la lista vacía, corré un barrido con --dry-run, mirá
# qué código traen los resultados buenos y agregá esas familias.
unspsc:
  familias:
    - "86"      # Educación y formación
    - "9312"    # Desarrollo social / comunitario

# Rango de valor en pesos colombianos. `maximo: null` = sin techo.
valor:
  minimo: 15000000      # $15.000.000
  maximo: null
